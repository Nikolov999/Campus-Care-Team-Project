services:
  - type: web
    name: campuscare-app
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port $PORT
    healthCheckPath: /_stcore/health
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_NAME
        value: CampusCare
      - key: APP_ENV
        value: production
      - key: ALLOWED_EMAIL_DOMAINS
        value: ncirl.ie,student.ncirl.ie
      - key: MAX_UPLOAD_MB
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: campuscare-db
          property: connectionString

databases:
  - name: campuscare-db
    region: frankfurt
    plan: free
    postgresMajorVersion: "17"
    databaseName: campuscare
    user: campuscare_user
    ipAllowList: []
